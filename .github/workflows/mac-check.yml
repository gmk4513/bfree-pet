#  맥에서 실제로 어떻게 보이고 어떻게 도는지 확인하는 판입니다.
#
#  맥이 없어서 손으로 못 눌러 보니, 기계가 대신 눌러 보게 합니다.
#  확실히 되는 것과 될지 모르는 것을 나눠서 합니다.
#
#    확실히 됨 : 창 레벨(독과의 위아래), 트레이 아이콘 유무,
#                모드 전환 때 포커스가 오가는지 (--selftest)
#    될지 모름 : 실제 키 입력 — 접근성 권한(TCC)에 막힐 수 있습니다
#
#  Actions 탭 → mac-check → Run workflow

name: mac-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    name: 맥에서 띄워 보기

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: mac-check

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # 빌드는 20분이 걸립니다. 화면이 빈 채로 나오는 사고는 여기서 2초면
      # 걸립니다 — 실제로 한 번 당했습니다.
      - name: pet.js 돌려 보기
        run: node tools/smoke.js

      - name: 앱 빌드
        run: npm run tauri build -- --bundles app

      - name: 앱 띄우기
        run: |
          APP=$(find src-tauri/target -maxdepth 6 -name "*.app" | head -1)
          echo "찾은 앱: $APP"
          if [ -z "$APP" ]; then echo "::error::.app 을 못 찾았습니다"; exit 1; fi
          open "$APP"
          sleep 12
          pgrep -lf -i bfree || echo "(비프리 프로세스가 안 보입니다)"

      - name: 창 레벨 · 독과의 위아래
        run: swift .github/mac-windows.swift

      # ── 여기서부터가 핵심입니다 ──
      #
      # 전에는 Rust 안에서 모드를 바꿔 놓고 쟀는데, 그러면 실제와 다릅니다.
      # 요즘 맥은 '최근에 사용자가 건드린 앱'이 아니면 스스로 앞으로
      # 나서는 걸 막습니다. 사람이 조작판 버튼을 누르는 그 클릭이 바로
      # 그 '건드림'인데, 그게 빠진 채로 쟀던 겁니다.
      #
      # 그래서 진짜로 눌러 봅니다. 조작판은 오른쪽 위 고정 위치라
      # 좌표를 알 수 있습니다 (1024x768 기준).
      # 커서를 '움직여서' 올려놓는 도구입니다. osascript 의 click 은 커서를
      # 순간이동시키고 바로 누르는데, 우리 창은 평소 클릭을 통과시키고
      # 커서가 버튼 위에 온 걸 60ms 마다 확인해서 그제야 통과를 끕니다.
      # 그래서 순간이동 클릭은 바탕화면으로 새어 나갑니다. 사람은 마우스를
      # 올려놓고 누르니까 안 겪는 일입니다.
      - name: cliclick 설치
        continue-on-error: true
        run: brew install cliclick

      - name: 사람처럼 눌러 보기
        continue-on-error: true
        run: |
          shot() { screencapture -x "$1.png"; echo "찍음: $1"; }
          click() {
            # 올려놓고 → 기다리고 → 누릅니다
            cliclick "m:$1,$2" >/dev/null 2>&1 || true
            sleep 0.6
            cliclick "c:$1,$2" >/dev/null 2>&1               && echo "눌렀습니다 ($1,$2)"               || osascript -e "tell application \"System Events\" to click at {$1, $2}" >/dev/null 2>&1               && echo "눌렀습니다 ($1,$2)" || echo "::warning::클릭 실패 ($1,$2)"
            sleep 0.4
          }
          key() { for i in $(seq 1 ${2:-1}); do
                    osascript -e "tell application \"System Events\" to key code $1" >/dev/null 2>&1 || true
                    sleep 0.25
                  done; echo "키 $1 를 ${2:-1}번 보냄"; }

          shot 1-처음_자동

          echo "::group::수동 조작 켜기"
          click 777 184          # 조작판의 '수동 조작' 버튼
          sleep 2
          shot 2-수동_켠_뒤      # 버튼이 주황색이어야 맞습니다
          echo "::endgroup::"

          echo "::group::방향키로 움직여 보기"
          key 124 12             # 오른쪽
          shot 3-오른쪽_간_뒤
          key 123 12             # 왼쪽
          shot 4-왼쪽_간_뒤
          echo "::endgroup::"

          echo "::group::Z 공격 / C 점프"
          key 6 4                # z
          shot 5-공격
          key 8 3                # c
          shot 6-점프
          echo "::endgroup::"

          echo "::group::Esc 로 자동 복귀"
          key 53 1               # esc
          sleep 2
          shot 7-자동_복귀       # 버튼이 회색으로 돌아와야 맞습니다
          echo "::endgroup::"

          echo "::group::두 번째로 수동 켜기 (여기가 의심 구간)"
          click 777 184
          sleep 2
          shot 8-수동_두번째
          key 124 12
          shot 9-두번째_이동     # 캐릭터가 또 움직여야 맞습니다
          echo "::endgroup::"

          echo "::group::적 소환"
          click 858 84           # '노인1'
          sleep 3
          shot 10-소환
          echo "::endgroup::"

      - name: 화면 찍기
        continue-on-error: true
        run: screencapture -x shot.png

      - name: 앱 로그 긁기
        if: always()
        continue-on-error: true
        run: |
          log show --last 3m --predicate 'process CONTAINS[c] "bfree"' --info --debug > app-log.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-check
          retention-days: 14
          if-no-files-found: warn
          path: |
            windows.txt
            shot.png
            *.png
            app-log.txt
