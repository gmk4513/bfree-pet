#  맥에서 실제로 어떻게 보이고 어떻게 도는지 확인하는 판입니다.
#
#  맥이 없어서 손으로 못 눌러 보니, 기계가 대신 눌러 보게 합니다.
#  확실히 되는 것과 될지 모르는 것을 나눠서 합니다.
#
#    확실히 됨 : 창 레벨(독과의 위아래), 트레이 아이콘 유무,
#                모드 전환 때 포커스가 오가는지 (--selftest)
#    될지 모름 : 실제 키 입력 — 접근성 권한(TCC)에 막힐 수 있습니다
#
#  Actions 탭 → mac-check → Run workflow

name: mac-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    name: 맥에서 띄워 보기

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: mac-check

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # 빌드는 20분이 걸립니다. 화면이 빈 채로 나오는 사고는 여기서 2초면
      # 걸립니다 — 실제로 한 번 당했습니다.
      - name: pet.js 돌려 보기
        run: node tools/smoke.js

      - name: 앱 빌드
        run: npm run tauri build -- --bundles app

      - name: 앱 띄우기 (자가 점검 모드)
        run: |
          APP=$(find src-tauri/target -maxdepth 6 -name "*.app" | head -1)
          echo "찾은 앱: $APP"
          if [ -z "$APP" ]; then echo "::error::.app 을 못 찾았습니다"; exit 1; fi
          echo "APP=$APP" >> $GITHUB_ENV
          open "$APP" --args --selftest
          # 자가 점검이 8초 뒤 시작해서 네 단계를 밟습니다. 넉넉히 기다립니다.
          sleep 30
          pgrep -lf -i bfree || echo "(비프리 프로세스가 안 보입니다)"

      - name: 모드 전환 때 포커스가 오갔는지
        run: |
          echo "--- 자가 점검 기록 ---"
          cat ~/bfree-selftest.log || echo "::warning::기록이 없습니다 (--selftest 가 안 돌았을 수 있음)"

      - name: 창 레벨 · 트레이 아이콘
        run: swift .github/mac-windows.swift

      # 여기서부터는 접근성 권한에 막힐 수 있습니다. 막혀도 판은 안 멈춥니다.
      - name: 키 입력 시험 (될지 모름)
        continue-on-error: true
        run: |
          screencapture -x before.png
          echo "--- osascript 로 키를 눌러 봅니다 ---"
          osascript -e 'tell application "System Events" to key code 124' \
            && echo "오른쪽 방향키 보냄" || echo "접근성 권한 없음 — 예상된 실패"
          for i in 1 2 3 4 5 6 7 8; do
            osascript -e 'tell application "System Events" to key code 124' >/dev/null 2>&1 || true
            sleep 0.3
          done
          sleep 1
          screencapture -x after.png
          ls -la before.png after.png

      - name: 화면 찍기
        continue-on-error: true
        run: screencapture -x shot.png

      - name: 앱 로그 긁기
        if: always()
        continue-on-error: true
        run: |
          log show --last 3m --predicate 'process CONTAINS[c] "bfree"' --info --debug > app-log.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-check
          retention-days: 14
          if-no-files-found: warn
          path: |
            windows.txt
            shot.png
            before.png
            after.png
            app-log.txt
            ~/bfree-selftest.log
