#  비프리 펫 — 윈도우 / 맥 설치 파일 만들기
#
#  맥이 없어도 맥용을 뽑기 위한 장치입니다. GitHub 이 빌려 주는 맥에서
#  빌드합니다. 공개 저장소는 무료입니다.
#
#  쓰는 법
#    1. 버전을 올린다 → package.json, src-tauri/Cargo.toml,
#                        src-tauri/tauri.conf.json 세 군데
#    2. git tag v0.1.0 && git push origin v0.1.0
#    3. 20~30분 뒤 Releases 에 초안이 생긴다. 내용 확인하고 "Publish"
#
#  손으로 돌려 보고 싶을 때는 Actions 탭에서 "Run workflow" 를 누르면
#  됩니다(그때는 릴리스를 만들지 않고 파일만 올립니다).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 애플 실리콘
          - os: macos-latest
            target: aarch64-apple-darwin
            label: mac-arm
          # 인텔 맥
          - os: macos-latest
            target: x86_64-apple-darwin
            label: mac-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Rust 준비
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Rust 빌드는 느립니다. 캐시가 없으면 매번 20분씩 걸립니다.
      - name: Rust 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: npm install

      - name: 빌드
        run: npm run tauri build -- --target ${{ matrix.target }}

      # 태그를 밀었을 때만 릴리스를 만듭니다.
      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      # 손으로 돌렸을 때는 Actions 화면에서 받아 볼 수 있게만 둡니다.
      - name: 결과물 보관
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: bfree-pet-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
